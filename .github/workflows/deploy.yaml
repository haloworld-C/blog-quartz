name: Deploy Quartz Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          ssh-key: ${{ secrets.OBSIDIAN_SUBMODULE_KEY }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Prepare publish repository
        env:
          PUBLISH_REPO_TOKEN: ${{ secrets.GIT_PAGES }}
        run: |
          if [ -z "$PUBLISH_REPO_TOKEN" ]; then
            echo "Missing required secret: PUBLISH_REPO_TOKEN"
            exit 1
          fi
          REMOTE_URL="https://x-access-token:${PUBLISH_REPO_TOKEN}@github.com/haloworld-C/haloworld-C.github.io.git"
          rm -rf deploy-repo
          if git ls-remote --exit-code --heads "$REMOTE_URL" main >/dev/null 2>&1; then
            git clone --depth 1 --branch main "$REMOTE_URL" deploy-repo
          else
            mkdir deploy-repo
            cd deploy-repo
            git init
            git checkout -b main
            git remote add origin "$REMOTE_URL"
          fi

      - name: Sync build output
        run: rsync -av --delete --exclude='.git' --exclude='.github' public/ deploy-repo/

      - name: Commit and push site
        env:
          PUBLISH_REPO_TOKEN: ${{ secrets.GIT_PAGES }}
        run: |
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet --exit-code; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Deploy from haloworld-C/blog-quartz@${GITHUB_SHA}"
          git remote -v
          if ! git push origin main; then
            echo "Publish push failed"
            exit 1
          fi
