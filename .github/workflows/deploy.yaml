name: Deploy Quartz Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          ssh-key: ${{ secrets.OBSIDIAN_SUBMODULE_KEY }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Prepare publish repository
        env:
          DEPLOY_KEY: ${{ secrets.OBSIDIAN_SUBMODULE_KEY }}
          PUBLISH_REPO_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
        run: |
          rm -rf deploy-repo
          mkdir deploy-repo
          cd deploy-repo
          git init
          git checkout -b main
          if [ -n "$PUBLISH_REPO_TOKEN" ]; then
            git remote add origin "https://x-access-token:${PUBLISH_REPO_TOKEN}@github.com/haloworld-C/haloworld-C.github.io.git"
          else
            mkdir -p ~/.ssh
            printf "%s" "$DEPLOY_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git remote add origin git@github.com:haloworld-C/haloworld-C.github.io.git
          fi

      - name: Sync build output
        run: rsync -av --delete --exclude='.git' --exclude='.github' public/ deploy-repo/

      - name: Commit and push site
        env:
          PUBLISH_REPO_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes
        run: |
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet --exit-code; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Deploy from haloworld-C/blog-quartz@${GITHUB_SHA}"
          git push origin main
